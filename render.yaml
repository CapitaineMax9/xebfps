# Déploiement en un clic sur Render (https://render.com) : New → Blueprint → choisir ce dépôt.
services:
  - type: web
    name: xebfps
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
